# Imported once by the shop (see README). Each area owns its folder: add a new .yaml file there.
bwlab_wishlist_shop:
    resource: "routes/shop/*.yaml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$

bwlab_wishlist_admin:
    resource: "routes/admin/*.yaml"
    prefix: /%sylius_admin.path_name%

bwlab_wishlist_api:
    resource: "routes/api/*.yaml"
