# sharing and gifting (0.3.0): classes in src/Share and src/Gift, wired by attributes.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Bwlab\SyliusWishlistPlugin\Share\:
        resource: '../../src/Share/'
        exclude: '../../src/Share/SharedWishlistTitle.php'

    Bwlab\SyliusWishlistPlugin\Gift\:
        resource: '../../src/Gift/'
        exclude: '../../src/Gift/{GiftSelector,GiftSession}.php'

    # «Already gifted» marker: listener NOT registered in 0.3.0 (security review: the mark would be set at order confirmation, before payment).
    # Bwlab\SyliusWishlistPlugin\EventListener\GiftOrderListener: ~
