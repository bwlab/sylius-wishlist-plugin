# Page "Wishlist > Settings". Same structure as the Sylius admin dashboard page.
sylius_twig_hooks:
    hooks:
        'bwlab_wishlist.admin.settings.index':
            sidebar:
                template: '@SyliusAdmin/shared/crud/common/sidebar.html.twig'
                priority: 200
            navbar:
                template: '@SyliusAdmin/shared/crud/common/navbar.html.twig'
                priority: 100
            content:
                template: '@SyliusAdmin/shared/crud/common/content.html.twig'
                priority: 0

        'bwlab_wishlist.admin.settings.index.content':
            flashes:
                template: '@SyliusAdmin/shared/crud/common/content/flashes.html.twig'
                priority: 300
            header:
                template: '@SyliusAdmin/shared/crud/common/content/header.html.twig'
                priority: 200
            forms:
                template: '@BwlabSyliusWishlistPlugin/admin/settings/forms.html.twig'
                priority: 100
            footer:
                template: '@SyliusAdmin/shared/crud/common/content/footer.html.twig'
                priority: -100

        'bwlab_wishlist.admin.settings.index.content.header':
            title_block:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block.html.twig'
                priority: 0

        'bwlab_wishlist.admin.settings.index.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
                configuration:
                    title: bwlab_wishlist.ui.admin.settings.title
                    icon: 'tabler:heart-handshake'
                priority: 0
